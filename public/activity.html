<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>학습활동 추천 | 수업 준비 도우미</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <p class="sidebar__title"><a href="index.html">수업 준비 도우미</a></p>
      <nav aria-label="기능 메뉴">
        <ul class="menu">
          <li class="menu__item"><a class="menu__link" href="quiz.html">퀴즈 생성기</a></li>
          <li class="menu__item"><a class="menu__link" href="activity.html" aria-current="page">학습활동 추천</a></li>
        </ul>
      </nav>
    </aside>

    <main class="main">
      <div class="content">
        <header>
          <h1 class="page-title">학습활동 추천</h1>
          <p class="page-desc">학습 목표에 맞는 학습활동을 추천합니다.</p>
        </header>

        <section class="card" aria-labelledby="form-title">
          <h2 class="section-title" id="form-title">입력</h2>
          <form class="form-grid" id="feature-form" novalidate data-feature="activity" data-result-title="학습활동 입력 내용">
            <div class="field">
              <label class="field__label" for="subject">과목</label>
              <input class="field__input" id="subject" name="subject" type="text" placeholder="예: 과학" required>
              <p class="field__hint">수업 과목을 적습니다.</p>
            </div>
            <div class="field">
              <label class="field__label" for="level">학년 또는 학습자 수준</label>
              <input class="field__input" id="level" name="level" type="text" placeholder="예: 중학교 2학년" required>
              <p class="field__hint">수업 대상의 학년이나 수준을 적습니다.</p>
            </div>
            <div class="field field--wide">
              <label class="field__label" for="goal">학습 목표</label>
              <textarea class="field__input" id="goal" name="goal" rows="4" placeholder="예: 물의 상태 변화를 예를 들어 설명할 수 있다" required></textarea>
              <p class="field__hint">이번 수업에서 이루려는 목표를 적습니다.</p>
            </div>
            <div class="field">
              <label class="field__label" for="minutes">활동 시간</label>
              <input class="field__input" id="minutes" name="minutes" type="number" inputmode="decimal" min="1" placeholder="예: 40" required data-label="활동 시간" data-unit="분">
              <p class="field__hint">1 이상의 숫자로, 분 단위로 적습니다.</p>
            </div>
            <div class="field">
              <label class="field__label" for="classSize">학급 규모</label>
              <input class="field__input" id="classSize" name="classSize" type="number" inputmode="numeric" min="1" placeholder="예: 25" required data-label="학급 규모" data-unit="명" data-integer="true">
              <p class="field__hint">1명 이상의 정수입니다.</p>
            </div>
            <div class="field">
              <label class="field__label" for="groupSize">모둠 인원</label>
              <input class="field__input" id="groupSize" name="groupSize" type="number" inputmode="numeric" min="2" max="6" placeholder="예: 4" required data-label="모둠 인원" data-unit="명" data-integer="true">
              <p class="field__hint">2~6 사이의 정수입니다.</p>
            </div>
            <div class="form-actions">
              <button class="button" type="submit">활동 추천</button>
            </div>
          </form>
        </section>

        <section aria-labelledby="results-title">
          <h2 class="section-title" id="results-title">결과</h2>
          <div class="results" id="results" aria-live="polite">
            <div class="card card--empty">
              <p>아직 결과가 없습니다. 입력을 채우고 활동 추천을 눌러 주세요.</p>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="js/form-check.js"></script>
  <script src="js/validate.js"></script>
  <script src="app.js"></script>
</body>
</html>
